spring.datasource.url=jdbc:mysql://localhost:3306/voiceapp?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.servlet.session.timeout=60m

app.python.base-url=${PYTHON_SERVICE_URL:http://localhost:8000}
app.audio-dir=${AUDIO_DIR:${user.home}/voiceapp-audio}
