<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<main class="narrow">
  <h1>Log in</h1>
  <p class="muted">Record your voice and get a fluency report.</p>
  <div class="card">
    <div class="notice" th:if="${param.registered}">Account created. Log in to continue.</div>
    <div class="notice" th:if="${param.logout}">You have been logged out.</div>
    <div class="notice bad" th:if="${param.error}">Wrong username or password.</div>
    <form th:action="@{/login}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn" type="submit">Log in</button></div>
    </form>
  </div>
  <p>New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
