<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<main class="narrow">
  <h1>Create an account</h1>
  <div class="card">
    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" th:field="*{username}" autocomplete="username">
      <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}" autocomplete="email">
      <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

      <label for="password">Password</label>
      <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password">
      <p class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

      <div class="actions"><button class="btn" type="submit">Create account</button></div>
    </form>
  </div>
  <p>Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
